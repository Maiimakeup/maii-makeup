<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maii Makeup</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #fff7fb;
      color: #333;
    }

    header {
      background: #f3b6d2;
      padding: 25px 15px;
      text-align: center;
    }

    header h1 {
      font-size: 32px;
      color: white;
    }

    header p {
      color: white;
      margin-top: 8px;
    }

    .aviso {
      background: white;
      margin: 15px;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 2px 8px #00000012;
    }

    .contenedor {
      max-width: 1000px;
      margin: auto;
      padding: 15px;
    }

    .productos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .producto {
      background: white;
      border-radius: 15px;
      padding: 12px;
      box-shadow: 0 3px 10px #00000012;
      text-align: center;
    }

    .producto img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 12px;
      background: #eee;
    }

    .producto h3 {
      margin: 10px 0 5px;
    }

    .precio {
      font-size: 18px;
      font-weight: bold;
      color: #d85b94;
      margin: 8px 0;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 11px 15px;
      cursor: pointer;
      font-weight: bold;
    }

    .agregar {
      background: #d85b94;
      color: white;
      width: 100%;
    }

    .carrito {
      background: white;
      margin-top: 30px;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 3px 10px #00000012;
    }

    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
      gap: 10px;
    }

    .eliminar {
      background: #eee;
      color: #555;
      padding: 6px 10px;
    }

    .total {
      font-size: 22px;
      font-weight: bold;
      margin-top: 20px;
      text-align: right;
    }
