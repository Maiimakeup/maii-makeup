<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Maii Makeup</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff7fb;
      color: #333;
    }

    header {
      background: #d98bb5;
      color: white;
      padding: 22px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 25px;
    }

    .container {
      max-width: 600px;
      margin: 25px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
    }

    h2 {
      margin-top: 0;
      color: #c66b9d;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #d477aa;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    button:hover {
      background: #c46699;
    }

    #preview {
      display: none;
      width: 140px;
      height: 140px;
      object-fit: cover;
      border-radius: 12px;
      margin-top: 12px;
    }

    .nota {
      font-size: 13px;
      color: #777;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<header>
  <h1>💄 Maii Makeup</h1>
  <p>Panel de administración</p>
</header>

<div class="container">
  <div class="card">

    <h2>Agregar producto</h2>

    <label>Nombre del producto</label>
    <input type="text" id="nombre" placeholder="Ej: Base líquida">

    <label>Precio mayorista</label>
    <input type="number" id="precio" placeholder="Ej: 12000">

    <label>Stock</label>
    <input type="number" id="stock" placeholder="Ej: 10">

    <label>Categoría</label>
    <select id="categoria">
      <option value="">Seleccionar categoría</option>
      <option>Labiales</option>
      <option>Bases</option>
      <option>Correctores</option>
      <option>Máscaras</option>
      <option>Sombras</option>
      <option>Rubores</option>
      <option>Iluminadores</option>
      <option>Otros</option>
    </select>

    <label>Imagen del producto</label>
    <input type="file" id="imagen" accept="image/*">

    <img id="preview">

    <button onclick="guardarProducto()">
      Guardar producto
    </button>

    <p class="nota">
      La imagen se cargará al almacenamiento y el producto quedará guardado en la base de datos.
    </p>

  </div>
</div>

<script>
function guardarProducto() {

  const nombre = document.getElementById("nombre").value;
  const precio = document.getElementById("precio").value;
  const stock = document.getElementById("stock").value;
  const categoria = document.getElementById("categoria").value;
  const imagen = document.getElementById("imagen").files[0];

  if (!nombre || !precio || !stock || !categoria || !imagen) {
    alert("Completá todos los campos.");
    return;
  }

  alert("Producto preparado. En el siguiente paso conectaremos este panel con Supabase.");

}
</script>

</body>
</html>
