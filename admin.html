<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Maii Makeup</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff7fb;
      color: #333;
    }

    header {
      background: #d98bb5;
      color: white;
      padding: 22px;
      text-align: center;
    }

    header h1 {
      margin: 0;
    }

    .container {
      max-width: 600px;
      margin: 25px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
    }

    h2 {
      color: #c66b9d;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #d477aa;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    button:disabled {
      opacity: .6;
    }

    #preview {
      display: none;
      width: 140px;
      height: 140px;
      object-fit: cover;
      border-radius: 12px;
      margin-top: 12px;
    }

    #mensaje {
      margin-top: 15px;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>

<body>

<header>
  <h1>💄 Maii Makeup</h1>
  <p>Panel de administración</p>
</header>

<div class="container">
  <div class="card">

    <h2>Agregar producto</h2>

    <label>Nombre del producto</label>
    <input type="text" id="nombre" placeholder="Ej: Base líquida">

    <label>Precio mayorista</label>
    <input type="number" id="precio" placeholder="Ej: 12000">

    <label>Stock</label>
    <input type="number" id="stock" placeholder="Ej: 10">

    <label>Categoría</label>
    <select id="categoria">
      <option value="">Seleccionar categoría</option>
      <option>Labiales</option>
      <option>Bases</option>
      <option>Correctores</option>
      <option>Máscaras</option>
      <option>Sombras</option>
      <option>Rubores</option>
      <option>Iluminadores</option>
      <option>Otros</option>
    </select>

    <label>Imagen del producto</label>
    <input type="file" id="imagen" accept="image/*">

    <img id="preview">

    <button id="guardar" onclick="guardarProducto()">
      Guardar producto
    </button>

    <div id="mensaje"></div>

  </div>
</div>

<script>
  /*
    ================================
    CONFIGURACIÓN DE SUPABASE
    ================================
  */

  const SUPABASE_URL = "https://ydapwodjmmxihkfiuddk.supabase.co";

  /*
    PEGÁ ACÁ TU PUBLISHABLE KEY.
    
    IMPORTANTE:
    Usá la clave que ya tenés en Supabase.
    No uses una secret/service_role key.
  */
  const SUPABASE_KEY = "sb_publishable_ezcd-XVSZChvsKuMg93WNA_yFVfImux";


  /*
    ================================
    PREVISUALIZACIÓN DE LA IMAGEN
    ================================
  */

  document.getElementById("imagen").addEventListener("change", function() {

    const archivo = this.files[0];
    const preview = document.getElementById("preview");

    if (!archivo) {
      preview.style.display = "none";
      return;
    }

    preview.src = URL.createObjectURL(archivo);
    preview.style.display = "block";
  });


  /*
    ================================
    GUARDAR PRODUCTO
    ================================
  */

  async function guardarProducto() {

    const nombre = document.getElementById("nombre").value.trim();
    const precio = document.getElementById("precio").value;
    const stock = document.getElementById("stock").value;
    const categoria = document.getElementById("categoria").value;
    const imagen = document.getElementById("imagen").files[0];

    const boton = document.getElementById("guardar");
    const mensaje = document.getElementById("mensaje");

    if (!nombre || !precio || !stock || !categoria || !imagen) {
      mensaje.textContent = "⚠️ Completá todos los campos.";
      return;
    }

    if (SUPABASE_KEY === "PEGAR_AQUI_TU_PUBLISHABLE_KEY") {
      mensaje.textContent = "⚠️ Falta configurar la Publishable Key.";
      return;
    }

    try {

      boton.disabled = true;
      boton.textContent = "Guardando...";

      /*
        Nombre único para la imagen
      */

      const nombreArchivo =
        Date.now() + "-" +
        imagen.name.replace(/[^a-zA-Z0-9._-]/g, "-");


      /*
        1. SUBIR IMAGEN A SUPABASE STORAGE
      */

      const subida = await fetch(
        SUPABASE_URL +
        "/storage/v1/object/Productos/" +
        nombreArchivo,
        {
          method: "POST",

          headers: {
            "Authorization": "Bearer " + SUPABASE_KEY,
            "apikey": SUPABASE_KEY,
            "Content-Type": imagen.type
          },

          body: imagen
        }
      );

      if (!subida.ok) {
        const error = await subida.text();
        throw new Error("Error al subir la imagen: " + error);
      }


      /*
        2. CREAR URL PÚBLICA DE LA IMAGEN
      */

      const imagenURL =
        SUPABASE_URL +
        "/storage/v1/object/public/Productos/" +
        nombreArchivo;


      /*
        3. GUARDAR LOS DATOS EN LA TABLA PRODUCTOS
      */

      const producto = await fetch(
        SUPABASE_URL + "/rest/v1/productos",
        {
          method: "POST",

          headers: {
            "Authorization": "Bearer " + SUPABASE_KEY,
            "apikey": SUPABASE_KEY,
            "Content-Type": "application/json",
            "Prefer": "return=minimal"
          },

          body: JSON.stringify({
            nombre: nombre,
            precio: Number(precio),
            stock: Number(stock),
            imagen: imagenURL,
            categoria: categoria
          })
        }
      );


      if (!producto.ok) {
        const error = await producto.text();
        throw new Error("Error al guardar el producto: " + error);
      }


      /*
        4. TODO LISTO
      */

      mensaje.textContent = "✅ Producto agregado correctamente.";

      document.getElementById("nombre").value = "";
      document.getElementById("precio").value = "";
      document.getElementById("stock").value = "";
      document.getElementById("categoria").value = "";
      document.getElementById("imagen").value = "";

      document.getElementById("preview").style.display = "none";

    } catch (error) {

      console.error(error);

      mensaje.textContent =
        "❌ No se pudo guardar: " + error.message;

    } finally {

      boton.disabled = false;
      boton.textContent = "Guardar producto";
    }
  }

</script>

</body>
</html>
