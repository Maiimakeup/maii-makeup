<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Panel de Administración</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 20px;
    }

    .contenedor {
      max-width: 500px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #preview {
      display: none;
      width: 150px;
      height: 150px;
      object-fit: cover;
      margin: 15px auto 0;
      border-radius: 10px;
    }

    #mensaje {
      margin-top: 20px;
      text-align: center;
      font-weight: bold;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <h1>Agregar producto</h1>

    <form id="formulario">

      <label for="nombre">Nombre</label>
      <input
        type="text"
        id="nombre"
        required
      >

      <label for="precio">Precio</label>
      <input
        type="number"
        id="precio"
        min="0"
        required
      >

      <label for="stock">Stock</label>
      <input
        type="number"
        id="stock"
        min="0"
        required
      >

      <label for="categoria">Categoría</label>
      <input
        type="text"
        id="categoria"
        required
      >

      <label for="imagen">Imagen</label>
      <input
        type="file"
        id="imagen"
        accept="image/*"
        required
      >

      <img id="preview" alt="Vista previa">

      <button type="submit" id="boton">
        Guardar producto
      </button>

    </form>

    <div id="mensaje"></div>

  </div>


<script>

  /*
    CONFIGURACIÓN SUPABASE
  */

  const SUPABASE_URL =
    "https://ydapwodjmmxihkfiuddk.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_ezcd-XVSZChvsKuMg93WNA_yFVfImux";


  /*
    ELEMENTOS
  */

  const formulario = document.getElementById("formulario");
  const boton = document.getElementById("boton");
  const mensaje = document.getElementById("mensaje");
  const imagenInput = document.getElementById("imagen");
  const preview = document.getElementById("preview");


  /*
    VISTA PREVIA DE IMAGEN
  */

  imagenInput.addEventListener("change", function () {

    const archivo = this.files[0];

    if (!archivo) {
      preview.style.display = "none";
      preview.src = "";
      return;
    }

    preview.src = URL.createObjectURL(archivo);
    preview.style.display = "block";

  });


  /*
    GUARDAR PRODUCTO
  */

  formulario.addEventListener("submit", async function (event) {

    event.preventDefault();

    mensaje.textContent = "";
    boton.disabled = true;
    boton.textContent = "Guardando...";

    try {

      const nombre =
        document.getElementById("nombre").value.trim();

      const precio =
        document.getElementById("precio").value;

      const stock =
        document.getElementById("stock").value;

      const categoria =
        document.getElementById("categoria").value.trim();

      const imagen =
        document.getElementById("imagen").files[0];


      /*
        VALIDACIONES
      */

      if (!nombre) {
        throw new Error("Falta el nombre del producto.");
      }

      if (!precio) {
        throw new Error("Falta el precio.");
      }

      if (!stock) {
        throw new Error("Falta el stock.");
      }

      if (!categoria) {
        throw new Error("Falta la categoría.");
      }

      if (!imagen) {
        throw new Error("Seleccioná una imagen.");
      }


      /*
        NOMBRE ÚNICO PARA LA IMAGEN
      */

      const nombreArchivo =
        Date.now() + "-" +
        imagen.name.replace(/[^a-zA-Z0-9._-]/g, "-");


      /*
        1. SUBIR IMAGEN A STORAGE

        Bucket: Productos
      */

      let subida;

      try {

        subida = await fetch(
          SUPABASE_URL +
          "/storage/v1/object/Productos/" +
          nombreArchivo,
          {
            method: "POST",

            headers: {
              "Authorization": "Bearer " + SUPABASE_KEY,
              "apikey": SUPABASE_KEY,
              "Content-Type": imagen.type
            },

            body: imagen
          }
        );

      } catch (error) {

        throw new Error(
          "No se pudo conectar con Supabase Storage. " +
          "Detalle: " + error.message
        );

      }


      if (!subida.ok) {

        const texto = await subida.text();

        throw new Error(
          "Error al subir la imagen: " + texto
        );

      }


      /*
        URL PÚBLICA DE LA IMAGEN
      */

      const imagenURL =
        SUPABASE_URL +
        "/storage/v1/object/public/Productos/" +
        nombreArchivo;


      /*
        2. GUARDAR PRODUCTO EN LA TABLA

        Tabla: productos
      */

      let producto;

      try {

        producto = await fetch(
          SUPABASE_URL +
          "/rest/v1/productos",
          {
            method: "POST",

            headers: {
              "Authorization": "Bearer " + SUPABASE_KEY,
              "apikey": SUPABASE_KEY,
              "Content-Type": "application/json",
              "Prefer": "return=minimal"
            },

            body: JSON.stringify({
              nombre: nombre,
              precio: Number(precio),
              stock: Number(stock),
              imagen: imagenURL,
              categoria: categoria
            })
          }
        );

      } catch (error) {

        throw new Error(
          "No se pudo conectar con la tabla productos. " +
          "Detalle: " + error.message
        );

      }


      if (!producto.ok) {

        const texto = await producto.text();

        throw new Error(
          "Error al guardar el producto: " + texto
        );

      }


      /*
        TODO CORRECTO
      */

      mensaje.textContent =
        "✅ Producto agregado correctamente.";

      formulario.reset();

      preview.src = "";
      preview.style.display = "none";


    } catch (error) {

      console.error("ERROR:", error);

      mensaje.textContent =
        "❌ No se pudo guardar: " +
        error.message;


    } finally {

      boton.disabled = false;
      boton.textContent =
        "Guardar producto";

    }

  });

</script>

</body>
</html>
