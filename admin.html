<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Panel de Administración</title>

  <!-- Librería oficial de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 20px;
    }

    .contenedor {
      width: 100%;
      max-width: 500px;
      margin: 30px auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      margin: 0 0 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      background: white;
    }

    input:focus {
      outline: none;
      border-color: #111;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #preview {
      display: none;
      width: 150px;
      height: 150px;
      object-fit: cover;
      margin: 15px auto 0;
      border-radius: 10px;
    }

    #mensaje {
      margin-top: 20px;
      text-align: center;
      font-weight: bold;
      line-height: 1.5;
      word-break: break-word;
    }

    .exito {
      color: green;
    }

    .error {
      color: #c00;
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <h1>Agregar producto</h1>

    <form id="formulario">

      <label for="nombre">Nombre</label>
      <input
        type="text"
        id="nombre"
        placeholder="Nombre del producto"
        required
      >

      <label for="precio">Precio</label>
      <input
        type="number"
        id="precio"
        min="0"
        step="1"
        placeholder="Precio"
        required
      >

      <label for="stock">Stock</label>
      <input
        type="number"
        id="stock"
        min="0"
        step="1"
        placeholder="Cantidad disponible"
        required
      >

      <label for="categoria">Categoría</label>
      <input
        type="text"
        id="categoria"
        placeholder="Categoría"
        required
      >

      <label for="imagen">Imagen</label>
      <input
        type="file"
        id="imagen"
        accept="image/jpeg,image/png,image/webp,image/gif"
        required
      >

      <img id="preview" alt="Vista previa">

      <button type="submit" id="boton">
        Guardar producto
      </button>

    </form>

    <div id="mensaje"></div>

  </div>


<script>

  /*
  =====================================================
  CONFIGURACIÓN DE SUPABASE
  =====================================================
  */

  const SUPABASE_URL =
    "https://ydapwodjmmxihkfiuddk.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_ezcd-XVSZChvsKuMg93WNA_yFVfImux";


  /*
  =====================================================
  CREAR CONEXIÓN CON SUPABASE
  =====================================================
  */

  const { createClient } = supabase;

  const cliente = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


  /*
  =====================================================
  ELEMENTOS DEL FORMULARIO
  =====================================================
  */

  const formulario =
    document.getElementById("formulario");

  const boton =
    document.getElementById("boton");

  const mensaje =
    document.getElementById("mensaje");

  const imagenInput =
    document.getElementById("imagen");

  const preview =
    document.getElementById("preview");


  /*
  =====================================================
  MOSTRAR VISTA PREVIA
  =====================================================
  */

  imagenInput.addEventListener("change", function () {

    const archivo = this.files[0];

    if (!archivo) {

      preview.src = "";
      preview.style.display = "none";

      return;
    }

    const url =
      URL.createObjectURL(archivo);

    preview.src = url;
    preview.style.display = "block";

  });


  /*
  =====================================================
  FUNCIÓN PARA MOSTRAR MENSAJES
  =====================================================
  */

  function mostrarMensaje(texto, tipo) {

    mensaje.textContent = texto;

    mensaje.className =
      tipo === "error"
        ? "error"
        : "exito";

  }


  /*
  =====================================================
  GUARDAR PRODUCTO
  =====================================================
  */

  formulario.addEventListener(
    "submit",
    async function (event) {

      event.preventDefault();

      mostrarMensaje("", "");

      boton.disabled = true;
      boton.textContent = "Guardando...";


      try {

        /*
        -------------------------------------------------
        OBTENER DATOS
        -------------------------------------------------
        */

        const nombre =
          document
            .getElementById("nombre")
            .value
            .trim();

        const precio =
          document
            .getElementById("precio")
            .value;

        const stock =
          document
            .getElementById("stock")
            .value;

        const categoria =
          document
            .getElementById("categoria")
            .value
            .trim();

        const imagen =
          imagenInput.files[0];


        /*
        -------------------------------------------------
        VALIDACIONES
        -------------------------------------------------
        */

        if (!nombre) {
          throw new Error(
            "Falta el nombre del producto."
          );
        }

        if (precio === "") {
          throw new Error(
            "Falta el precio."
          );
        }

        if (stock === "") {
          throw new Error(
            "Falta el stock."
          );
        }

        if (!categoria) {
          throw new Error(
            "Falta la categoría."
          );
        }

        if (!imagen) {
          throw new Error(
            "Seleccioná una imagen."
          );
        }


        /*
        -------------------------------------------------
        VALIDAR TIPO DE IMAGEN
        -------------------------------------------------
        */

        const tiposPermitidos = [
          "image/jpeg",
          "image/png",
          "image/webp",
          "image/gif"
        ];

        if (
          !tiposPermitidos.includes(imagen.type)
        ) {

          throw new Error(
            "El formato de imagen no es válido. " +
            "Usá JPG, PNG, WEBP o GIF."
          );

        }


        /*
        -------------------------------------------------
        NOMBRE ÚNICO PARA LA IMAGEN
        -------------------------------------------------
        */

        const extension =
          imagen.name
            .split(".")
            .pop()
            .toLowerCase();

        const nombreArchivo =
          Date.now() +
          "-" +
          Math.random()
            .toString(36)
            .substring(2, 8) +
          "." +
          extension;


        /*
        =================================================
        1. SUBIR IMAGEN
        BUCKET: Productos
        =================================================
        */

        mostrarMensaje(
          "Subiendo imagen...",
          ""
        );


        const { data: archivoSubido, error: errorSubida } =
          await cliente.storage
            .from("Productos")
            .upload(
              nombreArchivo,
              imagen,
              {
                cacheControl: "3600",
                upsert: false,
                contentType: imagen.type
              }
            );


        if (errorSubida) {

          console.error(
            "ERROR STORAGE:",
            errorSubida
          );

          throw new Error(
            "No se pudo subir la imagen: " +
            errorSubida.message
          );

        }


        /*
        =================================================
        2. OBTENER URL PÚBLICA
        =================================================
        */

        const {
          data: urlImagen
        } =
          cliente.storage
            .from("Productos")
            .getPublicUrl(
              archivoSubido.path
            );


        const imagenURL =
          urlImagen.publicUrl;


        /*
        =================================================
        3. GUARDAR PRODUCTO EN LA TABLA
        TABLA: productos
        =================================================
        */

        mostrarMensaje(
          "Guardando producto...",
          ""
        );


        const { data: productoGuardado, error: errorProducto } =
          await cliente
            .from("productos")
            .insert([
              {
                nombre: nombre,
                precio: Number(precio),
                stock: Number(stock),
                categoria: categoria,
                imagen: imagenURL
              }
            ])
            .select();


        if (errorProducto) {

          console.error(
            "ERROR TABLA:",
            errorProducto
          );


          /*
          Si la imagen se subió pero
          el producto no pudo guardarse,
          intentamos eliminar la imagen
          para no dejar archivos basura.
          */

          await cliente.storage
            .from("Productos")
            .remove([
              archivoSubido.path
            ]);


          throw new Error(
            "La imagen se subió, pero no se pudo guardar " +
            "el producto: " +
            errorProducto.message
          );

        }


        /*
        =================================================
        4. ÉXITO
        =================================================
        */

        console.log(
          "PRODUCTO GUARDADO:",
          productoGuardado
        );


        mostrarMensaje(
          "✅ Producto agregado correctamente.",
          "exito"
        );


        /*
        Limpiar formulario
        */

        formulario.reset();

        preview.src = "";
        preview.style.display = "none";


      } catch (error) {

        console.error(
          "ERROR COMPLETO:",
          error
        );


        mostrarMensaje(
          "❌ " + error.message,
          "error"
        );


      } finally {

        boton.disabled = false;

        boton.textContent =
          "Guardar producto";

      }

    }
  );

</script>

</body>
</html>
